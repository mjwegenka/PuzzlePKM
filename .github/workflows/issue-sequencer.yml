name: Issue Sequencer

on:
  issues:
    types: [closed, reopened]
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Advance roadmap queue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const sequencePath = path.join(process.env.GITHUB_WORKSPACE, '.github', 'issue-sequence.json');
            const sequence = JSON.parse(fs.readFileSync(sequencePath, 'utf8'));
            const issueNumbers = sequence.issues.map((i) => i.number);

            const READY = 'status:ready';
            const BLOCKED = 'status:blocked';
            const READY_COMMENT_MARKER = '<!-- issue-sequencer-ready -->';

            function dependencyList(depNumbers) {
              if (!depNumbers.length) return '- None';
              return depNumbers.map((dep) => `- #${dep}`).join('\n');
            }

            function buildCopilotPrompt(issue, depNumbers) {
              return [
                '### Copilot Prompt Template',
                '',
                'Use this prompt when assigning the issue to Copilot/coding agent:',
                '',
                '```md',
                `Implement GitHub issue #${issue.number}: ${issue.title}`,
                '',
                'Requirements:',
                '- Follow repository workflow rules in `AGENTS.md`.',
                '- Read in order: `README.md` -> `IMPLEMENTATION_DECISIONS.md` -> `DEVELOPMENT_PLAN.md`.',
                '- Keep behavior traceable with relevant `DEC-*` references.',
                '- Do not jump to later stage work unless required by this issue.',
                '- Keep changes minimal and scoped to this issue only.',
                '',
                'Dependencies already completed:',
                depNumbers.length ? depNumbers.map((dep) => `- #${dep}`).join('\n') : '- None',
                '',
                'Execution checklist:',
                '- [ ] Confirm acceptance criteria from the issue body.',
                '- [ ] Implement code + docs updates required by canonical ownership rules.',
                '- [ ] Run validation commands and include outputs summary in PR.',
                '- [ ] Open a PR that references and closes this issue.',
                '',
                'Validation commands:',
                '```bash',
                'npm run lint',
                'npm run build',
                'npm run issues:queue',
                '```',
                '',
                'PR checklist:',
                '- [ ] Link issue with `Closes #ISSUE_NUMBER`.',
                '- [ ] Include risk notes and rollback plan if migration-related.',
                '- [ ] Mention any new/updated `DEC-*` entries when behavior changed.',
                '```',
              ].join('\n');
            }

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              }
            }

            await ensureLabel(READY, '0E8A16', 'Next issue ready to execute in sequence');
            await ensureLabel(BLOCKED, 'B60205', 'Blocked by dependencies in the roadmap queue');

            const issueMap = new Map();
            for (const number of issueNumbers) {
              const { data } = await github.rest.issues.get({ owner, repo, issue_number: number });
              issueMap.set(number, data);
            }

            function hasLabel(issue, label) {
              return issue.labels.some((l) => (typeof l === 'string' ? l : l.name) === label);
            }

            async function setLabels(number, labels) {
              await github.rest.issues.setLabels({ owner, repo, issue_number: number, labels });
            }

            let nextReadyNumber = null;
            for (const item of sequence.issues) {
              const issue = issueMap.get(item.number);
              if (!issue || issue.state !== 'open') continue;
              const depsMet = item.dependsOn.every((dep) => issueMap.get(dep)?.state === 'closed');
              if (depsMet) {
                nextReadyNumber = item.number;
                break;
              }
            }

            for (const item of sequence.issues) {
              const issue = issueMap.get(item.number);
              if (!issue || issue.state !== 'open') continue;

              const depsMet = item.dependsOn.every((dep) => issueMap.get(dep)?.state === 'closed');
              const current = issue.labels.map((l) => (typeof l === 'string' ? l : l.name)).filter(Boolean);
              const base = current.filter((l) => l !== READY && l !== BLOCKED);

              if (!depsMet) {
                if (!hasLabel(issue, BLOCKED) || hasLabel(issue, READY)) {
                  await setLabels(item.number, [...base, BLOCKED]);
                  core.info(`Marked #${item.number} as blocked`);
                }
                continue;
              }

              if (item.number === nextReadyNumber) {
                const desired = [...base, READY];
                if (!hasLabel(issue, READY) || hasLabel(issue, BLOCKED)) {
                  await setLabels(item.number, desired);
                  core.info(`Marked #${item.number} as ready`);

                  const comments = await github.paginate(github.rest.issues.listComments, {
                    owner,
                    repo,
                    issue_number: item.number,
                    per_page: 100,
                  });
                  const alreadyCommented = comments.some((c) => c.body && c.body.includes(READY_COMMENT_MARKER));
                  if (!alreadyCommented) {
                    const depText = dependencyList(item.dependsOn);
                    const copilotPrompt = buildCopilotPrompt(issue, item.dependsOn);
                    const readyBody = [
                      READY_COMMENT_MARKER,
                      'This issue is now next in the automated sequence (all dependencies are closed).',
                      '',
                      '**Dependency context**',
                      depText,
                      '',
                      copilotPrompt,
                    ].join('\n');
                    await github.rest.issues.createComment({
                      owner,
                      repo,
                      issue_number: item.number,
                      body: readyBody,
                    });
                  }
                }
              } else if (hasLabel(issue, READY) || hasLabel(issue, BLOCKED)) {
                await setLabels(item.number, base);
                core.info(`Cleared queue labels on #${item.number}`);
              }
            }

            if (nextReadyNumber) {
              core.info(`Queue head is #${nextReadyNumber}`);
            } else {
              core.info('No open issues are ready. Queue may be complete or fully blocked.');
            }

